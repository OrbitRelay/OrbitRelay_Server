[package]
name = "orbitrelay-node"
version.workspace = true
edition.workspace = true

[dependencies]
orbitrelay-core.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
